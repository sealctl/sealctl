[workspace]
resolver = "2"
members = ["crates/sealctl", "crates/sealctl-core", "crates/sealctl-fakerelay"]

[workspace.package]
version = "0.7.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/sealctl/sealctl"
authors = ["Oleksiy Pylypenko"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "net", "macros", "io-util", "signal"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
clap = { version = "4.6", features = ["derive", "env"] }
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
