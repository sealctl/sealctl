[workspace]
resolver = "2"
members = ["crates/sealctl-ledger", "crates/sealctl"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/sealctl/sealctl"
authors = ["Oleksiy Pylypenko"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
card-backend = "0.2"
openpgp-card = "0.7"
openpgp-card-rpgp = "0.9"
pgp = "0.21"
hidapi = "2.6"
btleplug = "0.13"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }
futures = "0.3"
uuid = "1"
clap = { version = "4.6", features = ["derive", "env"] }
env_logger = "0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true
