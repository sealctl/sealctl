[package]
name = "sealctl-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sealctl-core = { path = "../crates/sealctl-core" }
sealctl = { path = "../crates/sealctl" }
serde_json = "1"
toml = "0.9"

# Not part of the main workspace: built with cargo fuzz on nightly.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "pairing_link"
path = "fuzz_targets/pairing_link.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sealed_file"
path = "fuzz_targets/sealed_file.rs"
test = false
doc = false
bench = false

