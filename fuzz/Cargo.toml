[package]
name = "sealctl-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sealctl-core = { path = "../crates/sealctl-core" }
sealctl = { path = "../crates/sealctl" }
serde_json = "1"
toml = "1.1"

# A member of the main workspace (one Cargo.lock), outside its default members: built only
# with cargo fuzz on nightly. The workspace release profile (LTO, strip) is overridden for
# fuzzing through CARGO_PROFILE_RELEASE_* in .github/workflows/fuzz.yml.

[[bin]]
name = "pairing_link"
path = "fuzz_targets/pairing_link.rs"
test = false
doc = false
bench = false

