name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Don't file it here — see SECURITY.md.
        Never paste your 24 words, secret values, `.sealed` files or logs with keys in them.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Command you ran, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: sealctl version
      placeholder: output of `sealctl --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 26.1 / Ubuntu 26.04"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and app version
      placeholder: "iOS 26.1 or Android 16, and the sealctl app version"
  - type: input
    id: agent
    attributes:
      label: AI agent, if one was involved
      placeholder: "Claude Code, Codex, Gemini CLI, … with its version, or none"
  - type: textarea
    id: status
    attributes:
      label: sealctl status
      description: Output of `sealctl status` (remove names if you prefer).
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output with `-v`. It never contains values, but review it before pasting.
      render: text
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Before you submit
      options:
        - label: This contains no secret values, words or keys.
          required: true
