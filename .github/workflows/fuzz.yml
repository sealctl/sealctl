name: Fuzz

# cargo-fuzz targets for every parser (SPEC 21): 2 minutes each on pull requests that touch
# a parser, 1 hour each nightly. A crash fails the job and uploads its input.

# No workflow path filter: the `changes` job asks scripts/select-tests.py whether the pull
# request touches a parser the targets use (.github/test-map, suite `fuzz`), and the fuzz jobs
# skip when it does not. Schedules, manual runs and the label `ci:full` run them.
on:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # one run per pull request (a new push cancels the old run); push, tag, schedule and manual
  # runs get a group of their own, so a run on main or a tag is never cancelled or replaced
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      fuzz: ${{ steps.select.outputs.fuzz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 -B scripts/select-tests.py --github

  fuzz:
    needs: changes
    # everything when `changes` failed (its output is then empty, never "false")
    if: ${{ !cancelled() && needs.changes.outputs.fuzz != 'false' }}
    runs-on: ubuntu-latest
    # build about 10 minutes; 2 minutes per target on pull requests, 1 hour nightly
    timeout-minutes: ${{ github.event_name == 'schedule' && 90 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        target: [pairing_link, sealed_file, id_file, request, bodies, channel, dotenv, project_toml, git_credential, relay_json, socket_line, handback]
    env:
      # cargo-fuzz needs nightly (sanitizers); overrides rust-toolchain.toml
      RUSTUP_TOOLCHAIN: nightly
      # the fuzz crate is a member of the main workspace: not its release profile's LTO and
      # strip (slow builds, no symbols in crash reports)
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_STRIP: "false"
      CARGO_PROFILE_RELEASE_DEBUG: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      # cargo fuzz has no --locked: fail here if Cargo.lock is out of date instead of
      # resolving fresh versions on the runner
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Run
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_EACH: ${{ github.event_name == 'schedule' && 3600 || 120 }}
        run: cargo fuzz run "$TARGET" -- -max_total_time="$SECONDS_EACH"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
