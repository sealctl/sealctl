name: Fuzz

# cargo-fuzz targets for every parser (SPEC 21): 2 minutes each on pull requests that touch
# a parser, 1 hour each nightly. A crash fails the job and uploads its input.

on:
  pull_request:
    paths: ["crates/sealctl-core/src/**", "crates/sealctl/src/**", "fuzz/**"]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [pairing_link, sealed_file, id_file, request, bodies, channel, dotenv, project_toml, git_credential, relay_json, socket_line, handback]
    env:
      # cargo-fuzz needs nightly (sanitizers); overrides rust-toolchain.toml
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      # cargo fuzz has no --locked: fail here if fuzz/Cargo.lock is out of date instead of
      # resolving fresh versions on the runner
      - run: cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null
      - name: Run
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_EACH: ${{ github.event_name == 'schedule' && 3600 || 120 }}
        run: cargo fuzz run "$TARGET" -- -max_total_time="$SECONDS_EACH"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
