name: Bindings

# sealctl-core with its `uniffi` feature: bindings generate in library mode, and a Swift and a
# Kotlin smoke test call fingerprint and open_request on docs/vectors/v1.json (SPEC 2.2, 23).

on:
  push:
    branches: [main]
    paths: ["crates/sealctl-core/**", "docs/vectors/**", "bindings/**", ".github/workflows/bindings.yml", "Cargo.lock"]
  pull_request:
    paths: ["crates/sealctl-core/**", "docs/vectors/**", "bindings/**", ".github/workflows/bindings.yml", "Cargo.lock"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install uniffi --version =0.32.2 --features cli --locked
      - run: cargo build -p sealctl-core --features uniffi --locked
      - name: Generate Swift
        run: |
          uniffi-bindgen generate --library target/debug/libsealctl_core.dylib --language swift --out-dir gen
          cp gen/sealctl_coreFFI.modulemap gen/module.modulemap
      - name: Swift smoke test
        run: |
          swiftc -I gen -L target/debug -lsealctl_core bindings/swift/main.swift gen/sealctl_core.swift -o smoke
          DYLD_LIBRARY_PATH=target/debug ./smoke docs/vectors/v1.json

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: fwilhe2/setup-kotlin@v1
      - run: cargo install uniffi --version =0.32.2 --features cli --locked
      - run: cargo build -p sealctl-core --features uniffi --locked
      - name: Generate Kotlin
        run: uniffi-bindgen generate --library target/debug/libsealctl_core.so --language kotlin --no-format --out-dir gen
      - name: Kotlin smoke test (JNA)
        run: |
          curl -fsSL -o jna.jar https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.17.0/jna-5.17.0.jar
          kotlinc -cp jna.jar gen/uniffi/sealctl_core/sealctl_core.kt bindings/kotlin/Smoke.kt -include-runtime -d smoke.jar
          java -Djna.library.path=target/debug -cp smoke.jar:jna.jar SmokeKt docs/vectors/v1.json
