name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # the kill and power-cut tests take about an hour on macOS; a hang fails instead of
    # holding the runner for 6 hours
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies (build, restic, LUKS)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libdbus-1-dev pkg-config restic cryptsetup dbus gnome-keyring
      - name: macOS dependencies (restic)
        if: runner.os == 'macOS'
        run: brew install restic
      # The runner's login keychain can be locked, and then the first keychain write waits
      # for an unlock dialog nobody sees. Use a fresh, unlocked default keychain instead.
      - name: macOS test keychain
        if: runner.os == 'macOS'
        run: |
          kc="$RUNNER_TEMP/sealctl-test.keychain-db"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security list-keychains -d user -s "$kc"
          security default-keychain -d user -s "$kc"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked
      # Integration tests drive the real OS tools (hdiutil/diskutil, cryptsetup via sudo, restic)
      # with a software OpenPGP key standing in for the Ledger. On the runners (never on a
      # developer's machine) they may also install and remove sealctl's launchd / systemd
      # services and use the login keychain.
      - run: cargo test --locked
        env:
          SEALCTL_TEST_SUDO: ${{ runner.os == 'Linux' && '1' || '' }}
          SEALCTL_TEST_SERVICES: '1'
          SEALCTL_TEST_KEYCHAIN: ${{ runner.os == 'macOS' && '1' || '' }}
      # `sealctl unseal --to keychain` on Linux: the Secret Service of gnome-keyring in a
      # private D-Bus session.
      - name: Secret Service store (Linux)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c 'echo -n ci-keyring | gnome-keyring-daemon --unlock --components=secrets >/dev/null && cargo test --locked --test unseal_stores keychain'
        env:
          SEALCTL_TEST_KEYCHAIN: '1'

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
