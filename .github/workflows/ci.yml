name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # one run per pull request (a new push cancels the old run); push, tag, schedule and manual
  # runs get a group of their own, so a run on main or a tag is never cancelled or replaced
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Supply chain (SPEC.md section 21): actions are pinned to full commit SHAs (Dependabot updates
# them after a cooldown); the compiler comes from rust-toolchain.toml; downloaded tools are
# checked against pinned SHA-256 digests or built from crates.io with --locked and a version.

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check

  # Which suites this pull request needs (SPEC 23, "Test selection"): scripts/select-tests.py
  # maps the changed files through .github/test-map. `test (ubuntu-latest)` runs the whole
  # `cargo test` on every pull request; the macOS tests and the test-hooks steps run only the
  # suites the change can affect. A path the map does not know, the label `ci:full`, and every
  # run that is not a pull request (main, tags, schedules, manual runs) select everything. If
  # this job fails, `test` runs everything (its outputs are then empty, never "false").
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.select.outputs.full }}
      it: ${{ steps.select.outputs.it }}
      cargo_test: ${{ steps.select.outputs.cargo_test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 -B scripts/select-tests.py --github

  test:
    name: test (${{ matrix.os }})
    needs: changes
    # a required check: it always runs, and with everything when `changes` failed
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # the kill and power-cut tests take about an hour on macOS; a hang fails instead of
    # holding the runner for 6 hours
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux dependencies (restic, LUKS)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y restic cryptsetup
      - name: macOS dependencies (restic)
        if: runner.os == 'macOS'
        run: brew install restic
      # A keychain file of its own for the keychain test (SEALCTL_TEST_KEYCHAIN_PATH, test-hooks
      # only): created and unlocked here, not added to the search list, not the default, so
      # nothing depends on the runner's login or default keychain.
      - name: macOS test keychain
        if: runner.os == 'macOS'
        run: |
          kc="$RUNNER_TEMP/sealctl-test.keychain-db"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "SEALCTL_TEST_KEYCHAIN_PATH=$kc" >> "$GITHUB_ENV"
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      # the test selection itself: example file lists and the suites they select
      - name: Test selection tests
        if: runner.os == 'Linux'
        run: python3 -B scripts/select-tests-test.py
      # Integration tests run the real binary in temporary HOMEs against the in-process fake
      # relay and a scripted phone, with the real OS tools (hdiutil on macOS, restic).
      # Linux: everything, on every pull request.
      - if: runner.os == 'Linux'
        run: cargo test --locked
      # macOS: the crates and integration tests the `changes` job selected (`cargo test`
      # arguments per crate, separated by `;`), or everything
      - name: cargo test (selected)
        if: runner.os == 'macOS'
        env:
          FULL: ${{ needs.changes.outputs.full }}
          RUNS: ${{ needs.changes.outputs.cargo_test }}
        run: |
          if [ "$FULL" != false ]; then
            cargo test --locked
            exit 0
          fi
          IFS=';' read -ra runs <<< "$RUNS"
          [ "${#runs[@]}" -gt 0 ] || echo "No Rust tests selected for this change (see the changes job)"
          for args in "${runs[@]}"; do
            echo "cargo test --locked $args"
            # shellcheck disable=SC2086 # one word per argument
            cargo test --locked $args
          done
      # The test-hooks steps run with their integration test (or everything).
      # tests that kill a run at a set point of its journal (SEALCTL_TEST_KILL, test-hooks only)
      - if: needs.changes.outputs.full != 'false' || contains(needs.changes.outputs.it, ' unseal ')
        run: cargo test --locked -p sealctl --features test-hooks --test unseal resume_after_a_kill
      # long operations against each other: kill points, stand-in restic, a phone that holds
      # requests, and the phone's clock moved on (every test of the file, hooks included)
      - if: needs.changes.outputs.full != 'false' || contains(needs.changes.outputs.it, ' long_ops ')
        run: cargo test --locked -p sealctl --features test-hooks --test long_ops
      # requests on the phone against locks and the clock: hold points in the daemon
      # (test-hold-<point>) and a wall clock moved on (test-clock-ahead-ms), every test of the file
      - if: needs.changes.outputs.full != 'false' || contains(needs.changes.outputs.it, ' daemon ')
        run: cargo test --locked -p sealctl --features test-hooks --test daemon
      # sparse bundles: runs resumed after a kill, and a lock while an open mounts (the daemon's
      # `mount` hold point)
      - if: runner.os == 'macOS' && (needs.changes.outputs.full != 'false' || contains(needs.changes.outputs.it, ' volumes '))
        run: cargo test --locked -p sealctl --features test-hooks --test volumes -- resumed a_lock_while_an_open_mounts
      # the Secret Service store (Linux runner only): gnome-keyring in a D-Bus session of this
      # step's own, unlocked with a random password; nothing of the runner's session is used
      - name: Secret Service store
        if: runner.os == 'Linux' && (needs.changes.outputs.full != 'false' || contains(needs.changes.outputs.it, ' stores '))
        run: |
          sudo apt-get install -y gnome-keyring libsecret-tools dbus
          dbus-run-session -- sh -c 'head -c 18 /dev/urandom | base64 | tr -d "\n" |
            gnome-keyring-daemon --unlock --components=secrets > /dev/null &&
            SEALCTL_TEST_SECRET_SERVICE=1 cargo test --locked -p sealctl --features test-hooks --test stores secret_service -- --nocapture'
      # the keychain store, in the keychain file made above (macOS runner only)
      - if: runner.os == 'macOS' && (needs.changes.outputs.full != 'false' || contains(needs.changes.outputs.it, ' stores '))
        run: cargo test --locked -p sealctl --features test-hooks --test stores keychain -- --nocapture

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # overrides rust-toolchain.toml: the declared rust-version must keep building
      RUSTUP_TOOLCHAIN: "1.89"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.89 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # The release binary, checked against its digest (the cargo-deny-action image downloads
      # it without one). Update: version and digest of the x86_64-unknown-linux-musl asset.
      - name: Install cargo-deny 0.21.0
        run: |
          f=cargo-deny-0.21.0-x86_64-unknown-linux-musl
          curl -fsSLo "$RUNNER_TEMP/$f.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.21.0/$f.tar.gz"
          echo "a2170b854ff697e79e39c4c538981c9c1bdd803addbae6719a4cb66b4585a903  $RUNNER_TEMP/$f.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f.tar.gz" -C "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/$f/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
      # one Cargo.lock for the workspace and the fuzz targets
      - run: cargo deny --locked check

  # cargo-vet (SPEC.md section 21): every crate is audited by us, covered by an imported audit
  # set (Mozilla, Google, Bytecode Alliance, ISRG, Zcash, Embark), or listed as an exemption in
  # supply-chain/config.toml. A new or updated crate fails here until `cargo vet` is run
  # locally and its audit or exemption is reviewed in the pull request.
  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # keeps the compiled cargo-vet in ~/.cargo/bin between runs (cache-bin)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: cargo-vet
          cache-targets: false
      # from crates.io (checksummed by the registry index), with its own Cargo.lock
      - name: Install cargo-vet 0.10.3
        run: cargo install cargo-vet --version 0.10.3 --locked
      - run: cargo vet --locked
      # A Dependabot bump fails here until its audit or exemption is added to the pull request
      # (supply-chain/); this prints what is missing and the smallest audits that would cover it.
      - name: What to audit
        if: failure()
        run: cargo vet suggest
