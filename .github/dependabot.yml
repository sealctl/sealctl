version: 2

# Version updates wait out a cooldown so a release that is yanked or found malicious in its
# first days is never proposed; security updates are not delayed (cooldown does not apply to
# them). Every Cargo update still has to pass cargo-deny and cargo-vet (supply-chain/) in CI.

updates:
  - package-ecosystem: cargo
    # one workspace and one Cargo.lock, the fuzz targets included
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # actions are pinned to commit SHAs with a version comment; Dependabot updates both
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  # rust-toolchain.toml (the pinned release compiler)
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # flake.lock (nixpkgs for `nix build` / `nix profile install`)
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
