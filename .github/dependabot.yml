version: 2

# Version updates wait out a cooldown so a release that is yanked or found malicious in its
# first days is never proposed; security updates are not delayed (cooldown does not apply to
# them). Every Cargo update still has to pass cargo-deny and cargo-vet (supply-chain/) in CI.

updates:
  - package-ecosystem: cargo
    # one workspace and one Cargo.lock, the fuzz targets included
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    # One PR for all minor and patch updates; each major update gets a PR of its own (it
    # matches no group), since majors need a changelog read and often code changes.
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # actions are pinned to commit SHAs with a version comment; Dependabot updates both
    cooldown:
      default-days: 14
    # Same split as Cargo: minor and patch together, each major separately.
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # rust-toolchain.toml (the pinned release compiler): a single dependency, so one PR per update
  # without a group.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # flake.lock (nixpkgs for `nix build` / `nix profile install`): a single input, no group needed.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
