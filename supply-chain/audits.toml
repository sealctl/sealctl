
# cargo-vet audits file

[[audits.arrayvec]]
who = "AI agent (Claude) for sealctl <support@sealctl.com>"
criteria = "safe-to-deploy"
delta = "0.7.6 -> 0.7.8"
notes = "0.7.6 -> 0.7.8 diff reviewed by an AI agent (Claude) on 2026-11-27: no build script, proc macros or dependency changes; adds the safe spare_capacity_mut (returns the uninitialised tail as MaybeUninit), fixes a zero-sized-type double drop in extend_from_iter with mem::forget, a u16 length type on 16-bit targets (lossless there), docs, tests and CI; no new unsafe outside a doc example; no I/O; not a human audit."

[[audits.base64]]
who = "AI agent (Claude) for sealctl <support@sealctl.com>"
criteria = "safe-to-deploy"
delta = "0.22.1 -> 0.23.1"
notes = "0.22.1 -> 0.23.1 diff reviewed by an AI agent (Claude) on 2026-11-27: new default feature simd-unsafe adds src/engine/simd.rs (read in full), AVX2 and NEON encode/decode kernels whose unaligned loads and stores are guarded against the slice lengths, chosen only after a runtime CPU check, a compile-time target feature or an unsafe constructor; the rest of the crate is deny(unsafe_code) and the default engines stay scalar; configurable padding symbol and error variant changes in safe code; no runtime dependencies, no build script, no I/O; SIMD arithmetic not proven correct; not a human audit."

[[audits.bip39]]
who = "AI agent (Claude) for sealctl <support@sealctl.com>"
criteria = "safe-to-deploy"
version = "3.0.0"
notes = "3.0.0 reviewed by an AI agent (Claude) on 2026-11-27: no build script, no proc macros, no unsafe code; the ten src/language files are only [&str; 2048] arrays of plain string literals; PBKDF2-HMAC-SHA512 in safe Rust over bitcoin_hashes; OsRng only in the optional rand generate functions; no file, network, process or environment access; not a cryptographic review, not a human audit."

[[audits.bitcoin_hashes]]
who = "AI agent (Claude) for sealctl <support@sealctl.com>"
criteria = "safe-to-deploy"
version = "0.14.101"
notes = "0.14.101 reviewed by an AI agent (Claude) on 2026-11-27: no build script, no proc macros, no FFI or asm, no file, network, process or environment access; unsafe is repr(transparent) byte-array-to-hash reference casts, volatile reads and writes in fixed_time_eq, the x86 SHA-NI sha256 path behind runtime is_x86_feature_detected checks with in-bounds unaligned loads and stores, and in-bounds unchecked loads in the SipHash-2-4 port of old std (copies from a pointer derived from a &u8, an aliasing-model nit); not a cryptographic review, not a human audit."

[[audits.cfg-if]]
who = "AI agent (Claude) for sealctl <support@sealctl.com>"
criteria = "safe-to-deploy"
delta = "1.0.4 -> 1.0.5"
notes = "1.0.4 -> 1.0.5 diff reviewed by an AI agent (Claude) on 2026-11-27: a deprecation note in the README and crate docs, changelog, version bumps and CI action pins; no code, macro, dependency or build changes; not a human audit."

[[audits.curve25519-dalek]]
who = "AI agent (Claude) for sealctl <support@sealctl.com>"
criteria = "safe-to-deploy"
version = "5.0.0"
notes = "5.0.0 reviewed by an AI agent (Claude) on 2026-11-27: build.rs reads CARGO_CFG_* variables and runs rustc --version (rustc_version) to pick the backend and word-size cfgs, nothing else; no_std, no file, network, process or FFI access; unsafe is register-only core::arch intrinsics in the x86_64 AVX2 and AVX-512 IFMA backends (plus two const array-to-__m256i transmutes), reached only through backend.rs after a cpufeatures runtime check, and one repr(transparent) basepoint-table reference cast; arithmetic and constant tables not checked; not a cryptographic review, not a human audit."

[[audits.curve25519-dalek-derive]]
who = "AI agent (Claude) for sealctl <support@sealctl.com>"
criteria = "safe-to-deploy"
version = "0.1.1"
notes = "0.1.1 reviewed by an AI agent (Claude) on 2026-11-27: proc macro only, no build script; syn/quote token rewriting with no file, environment, network or process access at compile time; the generated safe wrappers call #[target_feature] inner functions in unsafe blocks, so soundness rests on the caller's CPU feature check (curve25519-dalek 5.0.0 checks with cpufeatures before dispatch); not a human audit."

[[audits.ed25519-dalek]]
who = "AI agent (Claude) for sealctl <support@sealctl.com>"
criteria = "safe-to-deploy"
version = "3.0.0"
notes = "3.0.0 reviewed by an AI agent (Claude) on 2026-11-27: no build script, no proc macros, no unsafe code (forbid(unsafe_code) outside test and batch); no_std, no file, network, process or environment access in library code (test vectors and DER fixtures only in tests); secret keys zeroize on drop and compare in constant time, signing keys derive their own verifying key, verify_strict rejects small-order points; curve arithmetic is curve25519-dalek's; not a cryptographic review, not a human audit."

[[audits.getrandom]]
who = "AI agent (Claude) for sealctl <support@sealctl.com>"
criteria = "safe-to-deploy"
version = "0.4.3"
notes = "0.4.3 reviewed by an AI agent (Claude) on 2026-11-27: build.rs only emits a getrandom_msan cfg from CARGO_CFG_SANITIZE; all of src read; unsafe is the OS RNG calls (getrandom, getentropy, CCRandomGenerateBytes, ProcessPrng and others), raw-syscall, RDRAND and RNDR asm and dlsym lookups, with writes bounded by the buffer, EINTR and short reads handled and assume_init only after success; only file access is /dev/urandom read-only with O_CLOEXEC (and /dev/random polled, not read on Linux); no network or process access; the nightly opt-in extern_impl backend lets a safe user function skip initialisation (not used here); not a human audit."

[[audits.hex-conservative]]
who = "AI agent (Claude) for sealctl <support@sealctl.com>"
criteria = "safe-to-deploy"
version = "0.2.3"
notes = "0.2.3 reviewed by an AI agent (Claude) on 2026-11-27: no build script, no proc macros, no unsafe code; hex encoding and decoding in safe Rust over arrayvec ArrayString/ArrayVec with checked str::from_utf8; the io::Read impl only decodes in-memory hex; no FFI, file, network, process or environment access; not a human audit."

[[audits.hpke]]
who = "AI agent (Claude) for sealctl <support@sealctl.com>"
criteria = "safe-to-deploy"
version = "0.15.1"
notes = "0.15.1 reviewed by an AI agent (Claude) on 2026-11-27: no build script, no proc macros, no unsafe code; no_std, no file, network, process or environment access outside cfg(test) KAT tests; OS randomness through the default getrandom feature; secrets zeroize, the sequence counter is overflow-checked, malformed keys and ciphertexts return errors; panics are limited to API misuse in modes and KEM/KDF combinations sealctl does not enable; not a cryptographic review, not a human audit."

[[audits.libc]]
who = "AI agent (Claude) for sealctl <support@sealctl.com>"
criteria = "safe-to-deploy"
version = "0.2.191"
notes = "0.2.191 reviewed by an AI agent (Claude) on 2026-11-27: build.rs read in full (runs $RUSTC --version, through RUSTC_WRAPPER if set, and freebsd-version or emcc only for those targets; reads environment variables and emits cfgs only, writes no files); every function body across all targets extracted and every one containing unsafe read (FD_* and CPU_* use checked indexing, CMSG_* mirror the C macros' pointer arithmetic); macros.rs read; extern declarations, types and constants scanned for anything else, not compared against platform headers; no I/O of its own; not a human audit."

[[audits.r-efi]]
who = "AI agent (Claude) for sealctl <support@sealctl.com>"
criteria = "safe-to-deploy"
version = "6.0.0"
notes = "6.0.0 reviewed by an AI agent (Claude) on 2026-11-27: no build script, no proc macros, no_std; every function body read; the only library unsafe is two transmutes in Guid::from_bytes and as_bytes, sound for a repr(C) 16-byte struct of byte fields without padding; the rest is UEFI type, constant and function-pointer definitions, not checked against the UEFI specification; no I/O; not a human audit."

[[audits.typenum]]
who = "AI agent (Claude) for sealctl <support@sealctl.com>"
criteria = "safe-to-deploy"
version = "1.20.1"
notes = "1.20.1 reviewed by an AI agent (Claude) on 2026-11-27: no build script (the generated files under src/gen are committed: type aliases, ToUInt impls and the op! macro), no proc macros, no_std and forbid(unsafe_code) at the crate root; no I/O or environment access; optional scale-info dependency only; not a human audit."

[[audits.x25519-dalek]]
who = "AI agent (Claude) for sealctl <support@sealctl.com>"
criteria = "safe-to-deploy"
version = "3.0.0"
notes = "3.0.0 reviewed by an AI agent (Claude) on 2026-11-27: no build script, no proc macros, no unsafe code; no_std, about 300 lines wrapping curve25519-dalek's clamped scalar multiplication; no file, network, process or environment access (OS randomness only behind the optional getrandom feature); secret and shared-secret types zeroize on drop with the default feature; the bundled JPEG is a README image; not a cryptographic review, not a human audit."

