[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # rsa (via rPGP / openpgp-card-rpgp): Marvin timing attack on RSA *private-key*
    # decryption. sealctl never performs RSA private-key operations on the host —
    # private keys live on the Ledger, and sealctl uses Curve25519 keys.
    { id = "RUSTSEC-2023-0071", reason = "no host-side RSA private-key operations" },
    # crypto-bigint 0.5 (via rPGP NIST/X448 curves): non-constant-time arithmetic.
    # sealctl performs no private-key operations on these curves on the host.
    { id = "RUSTSEC-2026-0387", reason = "no host-side private-key ops on NIST/X448 curves" },
    # zvariant, zbus_names, zvariant_derive (via keyring 3 → zbus 4, the Linux Secret
    # Service): "unmaintained" because they were merged into zbus 6, not a vulnerability.
    # No keyring release uses zbus 6 yet; move when one does.
    { id = "RUSTSEC-2026-0370", reason = "merged into zbus 6; keyring still on zbus 4" },
    { id = "RUSTSEC-2026-0371", reason = "merged into zbus 6; keyring still on zbus 4" },
    { id = "RUSTSEC-2026-0372", reason = "merged into zbus 6; keyring still on zbus 4" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
