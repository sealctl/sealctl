[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # rsa (direct, and via ssh-key and ssh-agent-lib): Marvin timing attack on RSA *decryption*.
    # sealctl uses rsa only to sign with imported RSA SSH keys and never decrypts with RSA;
    # `ssh keygen` makes Ed25519 keys.
    { id = "RUSTSEC-2023-0071", reason = "no RSA decryption anywhere in sealctl" },
    # crypto-bigint 0.5 (via ssh-key's p256/p384 support): non-constant-time arithmetic.
    # sealctl's own keys are Ed25519 and X25519; only an ECDSA SSH key a user imports with
    # `seal ssh` would sign on these curves, locally. No ssh-key 0.6 release avoids it.
    { id = "RUSTSEC-2026-0387", reason = "NIST curves only for user-imported ECDSA SSH keys" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
# workspace-only crates that are never published (the fuzz targets)
private = { ignore = true }
exceptions = [
    # LLVM's libFuzzer, in the fuzz targets only (never in a release binary)
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
    { crate = "native-tls", use-instead = "rustls" },
]

# Build scripts run arbitrary code on the build machine (and on the release runners), so
# only these crates may have one. A crate that adds a build script, or a new dependency
# that has one, fails `cargo deny check` until it is reviewed and added here. Both
# workspaces (the fuzz one adds libfuzzer-sys).
[bans.build]
allow-build-scripts = [
    { crate = "anyhow" },
    { crate = "camino" },
    { crate = "curve25519-dalek" },
    { crate = "fs-err" },
    { crate = "generic-array" },
    { crate = "getrandom" },
    { crate = "httparse" },
    { crate = "icu_normalizer_data" },
    { crate = "icu_properties_data" },
    { crate = "jni" },
    { crate = "jni-macros" },
    { crate = "libc" },
    { crate = "libfuzzer-sys" },
    { crate = "libm" },
    { crate = "memoffset" },
    { crate = "nix" },
    { crate = "num-bigint-dig" },
    { crate = "num-traits" },
    { crate = "portable-atomic" },
    { crate = "portable-atomic-util" },
    { crate = "proc-macro2" },
    { crate = "quote" },
    { crate = "ring" },
    { crate = "rustix" },
    { crate = "rustls" },
    { crate = "rustversion" },
    { crate = "serde" },
    { crate = "serde_core" },
    { crate = "serde_json" },
    { crate = "signal-hook" },
    { crate = "thiserror" },
    { crate = "wasm-bindgen" },
    { crate = "wasm-bindgen-shared" },
    { crate = "windows_aarch64_gnullvm" },
    { crate = "windows_aarch64_msvc" },
    { crate = "windows_i686_gnu" },
    { crate = "windows_i686_gnullvm" },
    { crate = "windows_i686_msvc" },
    { crate = "windows_x86_64_gnu" },
    { crate = "windows_x86_64_gnullvm" },
    { crate = "windows_x86_64_msvc" },
    { crate = "wit-bindgen" },
    { crate = "zerocopy" },
    { crate = "zmij" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
