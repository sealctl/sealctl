# cargo-about: third-party licence notices for the sealctl binary (THIRD-PARTY-NOTICES.md).
# Regenerate with scripts/notices.sh when Cargo.lock changes; `--check` says whether it is stale.
# The accepted list matches deny.toml [licenses] allow (cargo deny check licenses gates it).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
# The release targets (packages.yml); one file covers all of them.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
