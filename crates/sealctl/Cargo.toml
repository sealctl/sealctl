[package]
name = "sealctl"
description = "Phone-approved keys for developer machines: secrets kept from AI agents, SSH, git signing, volumes, backups"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["secrets", "encryption", "ssh", "restic", "cli"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
sealctl-core = { path = "../sealctl-core", version = "0.7.0" }
anyhow.workspace = true
log.workspace = true
clap.workspace = true
clap_complete = "4.6"
env_logger.workspace = true
tokio.workspace = true
futures-util.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-platform-verifier = "0.7"
ssh-agent-lib = "0.6"
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519", "encryption", "getrandom"] }
# RSA keys signing rsa-sha2-256 in the agent (ssh-key signs RSA with SHA-512 only); already in the
# tree through ssh-agent-lib
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
serde.workspace = true
serde_json.workspace = true
toml = "1.1"
zeroize = "1"
getrandom = "0.4"
sha2 = "0.10"
signature = "3"
hex = "0.4"
base64 = "0.23"
regex = "1"
signal-hook = "0.4"
qrcode = { version = "0.15", default-features = false }
jiff = "0.2"
command-fds = "0.3"
nix = { version = "0.31", default-features = false, features = ["fs", "user", "resource", "socket", "term", "process", "signal"] }
# `unseal --to keychain`: macOS Keychain, or the Secret Service over zbus (no libdbus)
keyring = { version = "3", features = ["apple-native", "async-secret-service", "tokio", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
# proc_pidinfo, proc_pidpath and KERN_PROCARGS2: who started a credential helper
libc = "0.2"
# Keychain items with a readable label (keyring can't set one)
security-framework = "3"
core-foundation = "0.10"

[features]
# Tests only: the keychain service name can be overridden (SEALCTL_TEST_KEYCHAIN_SERVICE), a run
# can kill itself at a journal point (SEALCTL_TEST_KILL), the daemon stops at a hold point while
# a file test-hold-<point> is in the state folder (writing test-held-<point>), and a request's
# wait reads the wall clock moved on by the milliseconds in test-clock-ahead-ms there (each
# check that goes on appends them to test-clock-went-on). Never enabled in release builds.
test-hooks = []

[dev-dependencies]
tempfile = "3"
# paused time for the daemon's timer tests
tokio = { workspace = true, features = ["test-util"] }
sealctl-fakerelay = { path = "../sealctl-fakerelay" }
nix = { version = "0.31", default-features = false, features = ["term", "fs"] }
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519"] }

# ---- Linux packages (built on CI: cargo deb / cargo generate-rpm) ----
# Shell completions are generated into crates/sealctl/completions/ before packaging.

[package.metadata.deb]
maintainer = "Oleksiy Pylypenko"
copyright = "2026 Oleksiy Pylypenko and sealctl contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
sealctl keeps API keys out of .env files and away from AI agents, signs SSH logins and \
git commits, unlocks encrypted LUKS volumes and backs them up with restic. Keys are derived \
from 24 words held by the sealctl phone app, which approves their use."""
section = "utils"
priority = "optional"
# built on Rocky 9 (glibc 2.34) without dpkg-shlibdeps, so dependencies are explicit
depends = "libc6 (>= 2.34), libgcc-s1"
recommends = "restic, cryptsetup"
suggests = "git, openssh-client"
assets = [
    ["target/release/sealctl", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/sealctl/README.md", "644"],
    ["../../THIRD-PARTY-NOTICES.md", "usr/share/doc/sealctl/THIRD-PARTY-NOTICES.md", "644"],
    ["completions/sealctl.bash", "usr/share/bash-completion/completions/sealctl", "644"],
    ["completions/_sealctl", "usr/share/zsh/vendor-completions/_sealctl", "644"],
    ["completions/sealctl.fish", "usr/share/fish/vendor_completions.d/sealctl.fish", "644"],
]

[package.metadata.generate-rpm]
summary = "Phone-approved keys: secrets, SSH, git signing, volumes, backups"
license = "MIT"
url = "https://github.com/sealctl/sealctl"
assets = [
    { source = "target/release/sealctl", dest = "/usr/bin/sealctl", mode = "755" },
    # Licence files are not `doc`: systems installing with tsflags=nodocs (most container
    # images) skip %doc files, but the licences must ship with the binary.
    # cargo-generate-rpm has no %license flag; a plain file is always installed.
    { source = "../../LICENSE", dest = "/usr/share/licenses/sealctl/LICENSE", mode = "644" },
    { source = "../../THIRD-PARTY-NOTICES.md", dest = "/usr/share/licenses/sealctl/THIRD-PARTY-NOTICES.md", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/sealctl/README.md", mode = "644", doc = true },
    { source = "completions/sealctl.bash", dest = "/usr/share/bash-completion/completions/sealctl", mode = "644" },
    { source = "completions/_sealctl", dest = "/usr/share/zsh/site-functions/_sealctl", mode = "644" },
    { source = "completions/sealctl.fish", dest = "/usr/share/fish/vendor_completions.d/sealctl.fish", mode = "644" },
]

[package.metadata.generate-rpm.recommends]
restic = "*"
cryptsetup = "*"
