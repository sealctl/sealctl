[package]
name = "sealctl"
description = "Hardware-wallet backed encryption for everyday developer use: volumes, backups, secrets, SSH"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["openpgp", "ledger", "encryption", "smartcard", "cli"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
sealctl-ledger = { path = "../sealctl-ledger", version = "0.4.0" }
anyhow.workspace = true
log.workspace = true
openpgp-card.workspace = true
openpgp-card-rpgp.workspace = true
pgp.workspace = true
clap.workspace = true
clap_complete = "4.6"
env_logger.workspace = true
tokio = { workspace = true, features = ["net", "macros", "signal"] }
ssh-agent-lib = "0.6"
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519", "encryption", "getrandom"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
zeroize = "1"
getrandom = "0.3"
rand = "0.8"
sha2 = "0.10"
signature = "2"
hex = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
rpassword = "7"
hkdf = "0.12"
num-bigint = "0.4"
curve25519-dalek = "4"
bip39 = { version = "2", features = ["std", "zeroize"] }
hmac = "0.12"
sha3 = "0.10"
regex = "1"

[dev-dependencies]
tempfile = "3"
x25519-dalek = { version = "2", features = ["static_secrets"] }

# ---- Linux packages (built on CI: cargo deb / cargo generate-rpm) ----
# Shell completions are generated into crates/sealctl/completions/ before packaging.

[package.metadata.deb]
maintainer = "Oleksiy Pylypenko"
copyright = "2026 Oleksiy Pylypenko and sealctl contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
sealctl uses the OpenPGP application on a Ledger hardware wallet, over USB or Bluetooth, \
to unlock encrypted LUKS volumes, back them up with restic, keep API keys out of .env files, \
and sign SSH logins and git commits. Private keys never leave the device."""
section = "utils"
priority = "optional"
# built on Rocky 9 (glibc 2.34) without dpkg-shlibdeps, so dependencies are explicit
depends = "libc6 (>= 2.34), libgcc-s1, libudev1, libdbus-1-3"
recommends = "restic, cryptsetup"
suggests = "git, openssh-client"
assets = [
    ["target/release/sealctl", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/sealctl/README.md", "644"],
    ["completions/sealctl.bash", "usr/share/bash-completion/completions/sealctl", "644"],
    ["completions/_sealctl", "usr/share/zsh/vendor-completions/_sealctl", "644"],
    ["completions/sealctl.fish", "usr/share/fish/vendor_completions.d/sealctl.fish", "644"],
]

[package.metadata.generate-rpm]
summary = "Hardware-wallet backed encryption: volumes, backups, secrets, SSH"
license = "MIT"
url = "https://github.com/oleksiyp/sealctl"
assets = [
    { source = "target/release/sealctl", dest = "/usr/bin/sealctl", mode = "755" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/sealctl/LICENSE", mode = "644", doc = true },
    { source = "../../README.md", dest = "/usr/share/doc/sealctl/README.md", mode = "644", doc = true },
    { source = "completions/sealctl.bash", dest = "/usr/share/bash-completion/completions/sealctl", mode = "644" },
    { source = "completions/_sealctl", dest = "/usr/share/zsh/site-functions/_sealctl", mode = "644" },
    { source = "completions/sealctl.fish", dest = "/usr/share/fish/vendor_completions.d/sealctl.fish", mode = "644" },
]

[package.metadata.generate-rpm.recommends]
restic = "*"
cryptsetup = "*"
